[main]
include=nvidia-vr200-performance
summary=Optimized for inference workloads

[bootloader]
# Isolate CPUs for inference processes, 2 per socket
cmdline_isolcpus=isolcpus=${f:cpulist_invert:${f:calc_isolated_cores:2}}
# Allocate hugepages for better memory access
cmdline_hugepages=hugepagesz=2M hugepages=8192

[sysctl]
# Minimize latency
vm.swappiness=1
# kernel.sched_latency_ns and kernel.sched_min_granularity_ns omitted: these CFS sysctls
# were removed in kernel 6.8+ (EEVDF replaced CFS) and do not exist on Ubuntu 24.04.
